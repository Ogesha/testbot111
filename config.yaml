  daily_time: "09:30"
  selectors:
    card: ["div.catalog-products__item", "div.product", "div.product-card", "li.product"]
    title: [".catalog-products__item-title", ".product-title", "a.title", "h2", "h3"]
    price: [".catalog-products__item-price", ".price", ".product-price", ".amount"]
    link_from_title: true
    image: [".catalog-products__item img", ".product-card img", "img"]

# Категории и ключи для автокатегоризации (используются как резервный механизм)
categories:
  - name: "Телевизоры"
    keywords: ["телевизор", "tv", "oled", "lcd", "uhd"]
  - name: "Холодильники и морозильники"
    keywords: ["холодиль", "морозиль", "fridge"]
  - name: "Стиральные машины"
    keywords: ["стираль", "washer"]
  - name: "Микроволновые печи"
    keywords: ["микроволнов", "свч", "microwave"]

broadcast:
  autosend_daily_time: null
  message_template: "Каталог обновлён: {count} товаров"

storage:
  catalog_dir: "storage/catalog"
